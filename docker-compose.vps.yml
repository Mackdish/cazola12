services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trademall-app:latest
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=3072
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - trademall

  impression-scheduler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    env_file:
      - .env.vps
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl --silent --show-error --fail --max-time 20 \
            -X POST http://app:3000/api/internal/flush-impressions \
            -H "Authorization: Bearer $$${INTERNAL_WORKER_SECRET}" \
            -H "Content-Type: application/json" || true
          sleep 10
        done
    networks:
      - trademall

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TRADEMALL_DOMAIN: ${TRADEMALL_DOMAIN:?Set TRADEMALL_DOMAIN in .env.vps}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - trademall

networks:
  trademall:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
